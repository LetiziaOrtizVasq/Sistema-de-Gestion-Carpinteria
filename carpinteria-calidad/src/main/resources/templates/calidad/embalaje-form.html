<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' - Carpintería'">Embalaje</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('entrega')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">Carpintería</span>
    </div>
    <div th:if="${pasoActual != null}" th:replace="~{layout/stepper :: stepper(${pasoActual})}"></div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        <a th:href="@{/embalaje}">Embalaje</a>
        <span class="bc-sep">›</span>
        <span class="bc-current" th:text="${titulo}">Nuevo</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2 th:text="${titulo}">Embalaje</h2>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/embalaje}" class="btn btn-secondary">← Volver</a>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 th:text="${titulo}">Embalaje</h3>
          <p>Registrá cómo se preparó el producto para su entrega</p>
        </div>
        <form th:action="@{/embalaje}" th:object="${embalaje}" method="post">
          <input type="hidden" th:field="*{id}">
          <div class="card-body">
            <div class="form-grid">
              <div class="field full-width">
                <label>Pedido <span class="req">*</span></label>
                <select name="pedidoId" class="form-control" required>
                  <option value="">-- Seleccione un pedido --</option>
                  <option th:each="p : ${pedidos}"
                          th:value="${p.id}"
                          th:text="${'#' + p.id + ' — ' + p.cotizacion.solicitud.nombreCliente + ' / ' + p.cotizacion.solicitud.resumenProductos}"
                          th:selected="${embalaje.pedido != null and embalaje.pedido.id == p.id}">
                  </option>
                </select>
              </div>
              <div class="field">
                <label>Tipo de Embalaje</label>
                <input type="text" th:field="*{tipoEmbalaje}"
                       placeholder="Ej: Cartón, Stretch film, Madera..." class="form-control">
              </div>
              <div class="field">
                <label>Responsable</label>
                <input type="text" th:field="*{responsable}"
                       placeholder="Nombre del responsable" class="form-control">
              </div>
              <input type="hidden" th:field="*{fechaEmbalaje}">
              <div class="field">
                <label>Estado</label>
                <select th:field="*{estado}" class="form-control">
                  <option value="EN_PROCESO">En Proceso</option>
                  <option value="EMBALADO">Embalado</option>
                </select>
              </div>
              <div class="field full-width">
                <label>Observaciones</label>
                <textarea th:field="*{observaciones}"
                          placeholder="Detalles del embalaje..."
                          class="form-control"></textarea>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button type="submit" class="btn btn-primary">Guardar Embalaje</button>
            <a th:href="@{/embalaje}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
