<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embalaje - Carpintería</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('entrega')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">Carpintería</span>
    </div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        Calidad y Entrega
        <span class="bc-sep">›</span>
        <span class="bc-current">Embalaje</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2>Embalaje de Pedidos</h2>
          <p class="page-subtitle">Preparación y empaque del producto antes de la entrega</p>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/embalaje/nuevo}" class="btn btn-primary">+ Registrar Embalaje</a>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="count" th:text="${embalajes.size()} + ' embalaje(s)'"></span>
        </div>
        <div th:if="${embalajes.isEmpty()}" class="empty-state">
          <div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
          <div class="es-title">Sin embalajes</div>
          <div class="es-text">Registrá el embalaje de los pedidos listos para entregar.</div>
          <a th:href="@{/embalaje/nuevo}" class="btn btn-primary">+ Registrar Embalaje</a>
        </div>
        <table th:unless="${embalajes.isEmpty()}">
          <thead>
            <tr>
              <th>#</th><th>Pedido</th><th>Tipo Embalaje</th><th>Responsable</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${embalajes}">
              <td class="td-id" th:text="${e.id}"></td>
              <td class="td-bold" th:text="${'#' + e.pedido.id + ' — ' + e.pedido.cotizacion.solicitud.nombreCliente}"></td>
              <td th:text="${e.tipoEmbalaje != null ? e.tipoEmbalaje : '—'}"></td>
              <td th:text="${e.responsable != null ? e.responsable : '—'}"></td>
              <td>
                <span class="badge"
                      th:classappend="${e.estado != null and e.estado == 'EMBALADO'} ? 'badge-exitoso' : 'badge-proceso'"
                      th:text="${e.estado != null ? e.estado : 'EN_PROCESO'}"></span>
              </td>
              <td class="td-actions">
                <form th:action="@{/embalaje/{id}(id=${e.id})}" method="post"
                      style="display:inline"
                      onsubmit="return confirm('¿Eliminar este registro?')">
                  <input type="hidden" name="_method" value="DELETE">
                  <button type="submit" class="btn btn-danger btn-xs">Eliminar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
