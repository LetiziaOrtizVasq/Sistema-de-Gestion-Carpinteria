<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' - Carpintería'">Entrega</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('entrega')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">Carpintería</span>
    </div>
    <div th:if="${pasoActual != null}" th:replace="~{layout/stepper :: stepper(${pasoActual})}"></div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        <a th:href="@{/entregas}">Entregas</a>
        <span class="bc-sep">›</span>
        <span class="bc-current" th:text="${titulo}">Nueva</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2 th:text="${titulo}">Confirmar Entrega</h2>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/entregas}" class="btn btn-secondary">← Volver</a>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 th:text="${titulo}">Entrega</h3>
          <p>Confirmá que el cliente recibió el producto conforme</p>
        </div>
        <form th:action="@{/entregas}" th:object="${entrega}" method="post">
          <input type="hidden" th:field="*{id}">
          <div class="card-body">
            <div class="form-grid">
              <div class="field full-width">
                <label>Pedido <span class="req">*</span></label>
                <select name="pedidoId" class="form-control" required>
                  <option value="">-- Seleccione un pedido --</option>
                  <option th:each="p : ${pedidos}"
                          th:value="${p.id}"
                          th:text="${'#' + p.id + ' — ' + p.cotizacion.solicitud.nombreCliente + ' / ' + p.cotizacion.solicitud.resumenProductos}"
                          th:selected="${entrega.pedido != null and entrega.pedido.id == p.id}">
                  </option>
                </select>
              </div>
              <div class="field">
                <label>Recibido Por <span class="req">*</span></label>
                <input type="text" th:field="*{recibidoPor}"
                       th:classappend="${#fields.hasErrors('recibidoPor')} ? 'input-error'"
                       placeholder="Nombre de quien recibe" class="form-control">
                <span class="field-error" th:if="${#fields.hasErrors('recibidoPor')}"
                      th:errors="*{recibidoPor}"></span>
              </div>
              <div class="field">
                <label>CI del Receptor</label>
                <input type="text" th:field="*{ci}" placeholder="Ej: 1234567 CB" class="form-control">
              </div>
              <input type="hidden" th:field="*{fechaEntrega}">
              <div class="field">
                <label>Estado</label>
                <select th:field="*{estado}" class="form-control">
                  <option value="PENDIENTE">Pendiente</option>
                  <option value="ENTREGADO">Entregado</option>
                </select>
              </div>
              <div class="field full-width">
                <label>Observaciones</label>
                <textarea th:field="*{observaciones}"
                          placeholder="Notas sobre la entrega..." class="form-control"></textarea>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button type="submit" class="btn btn-primary">Confirmar Entrega</button>
            <a th:href="@{/entregas}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
