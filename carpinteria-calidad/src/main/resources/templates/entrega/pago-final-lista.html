<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos Finales - Carpintería</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('entrega')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">Carpintería</span>
    </div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        Calidad y Entrega
        <span class="bc-sep">›</span>
        <span class="bc-current">Pagos Finales</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2>Pagos Finales</h2>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/pagos-final/nuevo}" class="btn btn-primary">+ Registrar Pago Final</a>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="count" th:text="${pagos.size()} + ' pago(s)'"></span>
        </div>
        <div th:if="${pagos.isEmpty()}" class="empty-state">
          <div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/><line x1="7" y1="15" x2="11" y2="15"/></svg></div>
          <div class="es-title">Sin pagos finales</div>
          <div class="es-text">Registrá el 50% restante después de la entrega del producto.</div>
          <a th:href="@{/entregas}" class="btn btn-primary">Ver entregas</a>
        </div>
        <table th:unless="${pagos.isEmpty()}">
          <thead>
            <tr>
              <th>#</th><th>Cliente</th><th>Producto</th><th>50% Restante</th>
              <th>Monto Pagado</th><th>Método</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pagos}">
              <td class="td-id" th:text="${p.id}"></td>
              <td class="td-bold" th:text="${p.pedido.cotizacion.solicitud.nombreCliente}"></td>
              <td th:text="${p.pedido.cotizacion.solicitud.resumenProductos}"></td>
              <td th:text="'Bs. ' + ${#numbers.formatDecimal(p.montoRequerido, 1, 2)}"></td>
              <td class="td-total" th:text="'Bs. ' + ${#numbers.formatDecimal(p.montoPagado, 1, 2)}"></td>
              <td th:text="${p.metodoPago}"></td>
              <td>
                <span class="badge"
                      th:classappend="${p.estado == 'PENDIENTE'} ? 'badge-pendiente' : 'badge-exitoso'"
                      th:text="${p.estado}"></span>
              </td>
              <td class="td-actions">
                <form th:action="@{/pagos-final/{id}(id=${p.id})}" method="post"
                      style="display:inline"
                      onsubmit="return confirm('¿Eliminar este pago final?')">
                  <input type="hidden" name="_method" value="DELETE">
                  <button type="submit" class="btn btn-danger btn-xs">Eliminar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
