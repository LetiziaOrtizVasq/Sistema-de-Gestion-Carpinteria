<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores - MaderaCraft</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('inventario')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">MaderaCraft</span>
    </div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        <a th:href="@{/inventario}">Inventario</a>
        <span class="bc-sep">›</span>
        <span class="bc-current">Proveedores</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2>Proveedores</h2>
          <span class="cu-tag">Gestión de proveedores de madera</span>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/inventario}" class="btn btn-secondary btn-sm">← Inventario</a>
          <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">+ Nuevo Proveedor</a>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="count" th:text="${proveedores.size()} + ' proveedor(es)'"></span>
        </div>
        <div th:if="${proveedores.isEmpty()}" class="empty-state">
          <div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18z"/><path d="M6 12H4a2 2 0 0 0-2 2v8h4"/><path d="M18 9h2a2 2 0 0 1 2 2v11h-4"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg></div>
          <div class="es-title">Sin proveedores</div>
          <div class="es-text">Registrá los proveedores de madera del taller.</div>
          <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">+ Nuevo Proveedor</a>
        </div>
        <table th:unless="${proveedores.isEmpty()}">
          <thead>
            <tr>
              <th>#</th><th>Nombre</th><th>Contacto</th><th>Teléfono</th>
              <th>Email</th><th>RUC/NIT</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${proveedores}">
              <td class="td-id" th:text="${p.id}"></td>
              <td class="td-bold" th:text="${p.nombre}"></td>
              <td th:text="${p.contacto != null and p.contacto != '' ? p.contacto : '—'}"></td>
              <td th:text="${p.telefono != null and p.telefono != '' ? p.telefono : '—'}"></td>
              <td th:text="${p.email != null and p.email != '' ? p.email : '—'}"></td>
              <td th:text="${p.ruc != null and p.ruc != '' ? p.ruc : '—'}"></td>
              <td>
                <span class="badge"
                      th:classappend="${p.activo} ? 'badge-exitoso' : 'badge-gris'"
                      th:text="${p.activo ? 'Activo' : 'Inactivo'}"></span>
              </td>
              <td class="td-actions">
                <a th:href="@{/proveedores/editar/{id}(id=${p.id})}" class="btn btn-secondary btn-xs">Editar</a>
                <form th:action="@{/proveedores/{id}(id=${p.id})}" method="post"
                      style="display:inline"
                      onsubmit="return confirm('¿Eliminar este proveedor?')">
                  <input type="hidden" name="_method" value="DELETE">
                  <button type="submit" class="btn btn-danger btn-xs">Eliminar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
