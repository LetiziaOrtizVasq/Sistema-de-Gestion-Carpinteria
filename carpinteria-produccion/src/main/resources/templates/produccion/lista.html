<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producción - Carpintería</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('produccion')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">Carpintería</span>
    </div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        Operaciones
        <span class="bc-sep">›</span>
        <span class="bc-current">Producción</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2>Asignaciones de Producción</h2>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/produccion/nuevo}" class="btn btn-primary">+ Nueva Asignación</a>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="count" th:text="${asignaciones.size()} + ' asignación(es)'"></span>
        </div>

        <div th:if="${asignaciones.isEmpty()}" class="empty-state">
          <div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></div>
          <div class="es-title">Sin asignaciones</div>
          <div class="es-text">Asigná pedidos a los operarios del taller para iniciar la producción.</div>
          <a th:href="@{/produccion/nuevo}" class="btn btn-primary">+ Nueva Asignación</a>
        </div>

        <table th:unless="${asignaciones.isEmpty()}">
          <thead>
            <tr>
              <th>#</th><th>Pedido</th><th>Operario</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="a : ${asignaciones}">
              <td class="td-id" th:text="${a.id}"></td>
              <td class="td-bold" th:text="${'#' + a.pedido.id + ' — ' + a.pedido.cotizacion.solicitud.nombreCliente + ' / ' + a.pedido.cotizacion.solicitud.resumenProductos}"></td>
              <td th:text="${a.operario}"></td>
              <td>
                <span class="badge"
                      th:classappend="${a.estado == 'ASIGNADO'} ? 'badge-pendiente' :
                                     (${a.estado == 'EN_PROCESO'} ? 'badge-proceso' : 'badge-exitoso')"
                      th:text="${a.estado}"></span>
              </td>
              <td class="td-actions">
                <a th:href="@{/produccion/{id}/avances(id=${a.id})}" class="btn btn-warning btn-xs">Avances</a>
                <a th:href="@{/produccion/editar/{id}(id=${a.id})}" class="btn btn-secondary btn-xs">Editar</a>
                <form th:action="@{/produccion/{id}(id=${a.id})}" method="post"
                      style="display:inline"
                      onsubmit="return confirm('¿Eliminar esta asignación?')">
                  <input type="hidden" name="_method" value="DELETE">
                  <button type="submit" class="btn btn-danger btn-xs">Eliminar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
