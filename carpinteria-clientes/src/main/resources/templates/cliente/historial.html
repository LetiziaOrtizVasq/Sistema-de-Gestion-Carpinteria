<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Historial: ' + ${cliente.nombreCompleto} + ' - MaderaCraft'">Historial</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/nav :: nav('clientes')}"></div>
  <div class="main-wrapper">
    <div class="topbar-mobile">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="mobile-brand">MaderaCraft</span>
    </div>
    <div class="content-area">

      <nav class="breadcrumb">
        <a th:href="@{/}">Inicio</a>
        <span class="bc-sep">›</span>
        <a th:href="@{/clientes}">Clientes</a>
        <span class="bc-sep">›</span>
        <span class="bc-current" th:text="${cliente.nombreCompleto}">Historial</span>
      </nav>

      <div class="page-header">
        <div class="page-header-info">
          <h2 th:text="'Historial: ' + ${cliente.nombreCompleto}">Historial</h2>
          <span class="cu-tag">CU-07 — Consultar historial de pedidos por cliente</span>
        </div>
        <div class="page-header-actions">
          <a th:href="@{/clientes}" class="btn btn-secondary">← Volver</a>
        </div>
      </div>

      <div class="info-panel">
        <div class="info-item">
          <span class="info-label">Teléfono</span>
          <span class="info-value" th:text="${cliente.telefono}"></span>
        </div>
        <div class="info-item" th:if="${cliente.email != null and cliente.email != ''}">
          <span class="info-label">Email</span>
          <span class="info-value" th:text="${cliente.email}"></span>
        </div>
        <div class="info-item" th:if="${cliente.ci != null and cliente.ci != ''}">
          <span class="info-label">CI</span>
          <span class="info-value" th:text="${cliente.ci}"></span>
        </div>
        <div class="info-item" th:if="${cliente.direccion != null and cliente.direccion != ''}">
          <span class="info-label">Dirección</span>
          <span class="info-value" th:text="${cliente.direccion}"></span>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="count" th:text="'Solicitudes: ' + ${solicitudes.size()}"></span>
          <a th:href="@{/solicitudes/nueva}" class="btn btn-primary btn-sm">+ Nueva solicitud</a>
        </div>

        <div th:if="${solicitudes.isEmpty()}" class="empty-state">
          <div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12h6M9 16h6"/></svg></div>
          <div class="es-title">Sin solicitudes</div>
          <div class="es-text">Este cliente no tiene solicitudes registradas aún.</div>
          <a th:href="@{/solicitudes/nueva}" class="btn btn-primary">Crear primera solicitud</a>
        </div>

        <table th:unless="${solicitudes.isEmpty()}">
          <thead>
            <tr><th>#</th><th>Artículos solicitados</th><th>Estado</th></tr>
          </thead>
          <tbody>
            <tr th:each="s : ${solicitudes}">
              <td class="td-id" th:text="${s.id}"></td>
              <td class="td-bold" th:text="${s.resumenProductos}"></td>
              <td>
                <span class="badge"
                      th:classappend="${s.estado == 'PENDIENTE'} ? 'badge-pendiente' :
                                     (${s.estado == 'EN_PROCESO'} ? 'badge-proceso' :
                                     (${s.estado == 'COTIZADA'} ? 'badge-exitoso' : 'badge-gris'))"
                      th:text="${s.estado}"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>
</html>
