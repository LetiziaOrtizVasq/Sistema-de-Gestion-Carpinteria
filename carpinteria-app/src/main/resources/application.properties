spring.application.name=carpinteria

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/carpinteriadb?useSSL=false&serverTimezone=America/La_Paz&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Carpinteria2025!

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Filtro para soportar metodos PUT y DELETE desde formularios HTML
spring.mvc.hiddenmethod.filter.enabled=true

server.port=8080

# Thymeleaf — sin caché para ver cambios en templates al instante
spring.thymeleaf.cache=false

# Subida de imágenes y archivos
carpinteria.upload.dir=${user.home}/carpinteria-uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

